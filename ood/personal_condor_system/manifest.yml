---
name: Create Personal HTCondor Cluster
category: Interactive Apps
subcategory: Servers
role: batch_connect
description: |
  Launch a personal HTCondor Cluster as a single-node Slurm job. A cluster consists of one
  Access Point (Submit Node) and one Execution Point (Worker Node). Any jobs already in your
  personal HTCondor job queue, such as ones submitted earlier from **Create Personal HTCondor
  Access Point**, are picked up and run automatically.

  **Note** For best results, do not run multiple simultaneous personal HTCondor Clusters.
