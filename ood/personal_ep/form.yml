---
cluster: "*" # Glob: show a dropdown of every cluster configured on this OOD instance.
form:
  - slurm_partition
  - num_eps
  - cpus
  - memory
  - time_limit
  - base_dir

attributes:
  slurm_partition:
    widget: text_field
    label: "Slurm partition"
    value: "shared"
    required: true
  num_eps:
    widget: number_field
    label: "Number of EPs"
    value: 1
    min: 1
    help: >-
      EPs provide additional compute capacity to your HTCondor cluster. 
  cpus:
    widget: number_field
    label: "CPUs per node"
    value: 2
    min: 1
  memory:
    widget: number_field
    label: "Memory per node (GB)"
    value: 4
    min: 1
  time_limit:
    widget: text_field
    label: "Time limit"
    value: "4:00:00"
    help: "Slurm time format, e.g. HH:MM:SS or D-HH:MM:SS. The EP runs only as long as this job does."
  base_dir:
    widget: text_field
    label: "Base install directory"
    value: ""
    help: >-
      Working directory for your HTCondor cluster. Defaults to /scratch/$USER.
      Must be on shared storage, accessible from both the login node and all worker nodes.
