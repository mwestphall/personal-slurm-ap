name: Personal HTCondor EP
category: Interactive Apps
subcategory: Servers
role: batch_connect
description: |
  Launch one or more personal HTCondor Execution Points (EPs), one per node, as a Slurm job attached to the
  AP launched by the Personal HTCondor AP app.

  **Note**: Ensure that you have an active **Personal HTCondor AP** interactive app session running prior
  to launching an EP job.
