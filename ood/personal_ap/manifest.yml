---
name: Personal HTCondor AP
category: Interactive Apps
subcategory: Servers
role: batch_connect
description: |
  Launch a personal HTCondor Access Point (AP) as a Slurm job. The AP holds your HTCondor job queue;
  you will need to launch a **Personal HTCondor EP** alongside this AP to run your queued jobs, or set **Number of nodes** above 1 to launch EPs on the
  additional nodes of this same job.

  **Note** For best results, only run a single instance of the AP app at a time.
